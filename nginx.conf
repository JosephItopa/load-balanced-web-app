events {
    worker_connections 1024;
}

http {
    upstream backend {
        server web1:80;
        server web2:80;
        server web3:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_set_header Accept-Encoding "";
            sub_filter "${HOSTNAME}" "$upstream_addr";
            sub_filter_once on;
        }
    }
}